<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>JSON Diff Studio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Compare documentos JSON de forma inteligente e visual: validação, Pretty Print automático, diff estrutural e Tree Diff — 100% no navegador."
    />
    <meta name="theme-color" content="#0b1120" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Aplica o tema salvo antes da renderização para evitar flash de tema incorreto.
      try {
        var t = JSON.parse(localStorage.getItem('jds.theme'));
        if (t === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>O JSON Diff Studio requer JavaScript habilitado.</noscript>
  </body>
</html>
